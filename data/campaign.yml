npcs:
  - id: kai-mellathorn
    name: Kai Mellathorn
    role: Galapa Citizen
    location: solitaire
    description: >-
      A Galapa located in Solitaire. The party met him at the beginning of the
      campaign. He had a notably negative interaction with Orna Kaan, where he
      talked down to her quite a bit.
  - id: king-emeris
    name: King Emeris
    role: King of Hearth
    location: solitaire
    description: >-
      The King of the Kingdom of Hearth and the main quest giver to the party.
      He employs Orna Kaan as his right-hand sorcerer. He tasked the party with
      delivering a mysterious box to the village of Hush.
